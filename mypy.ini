[mypy]
python_version = 3.11
files = app.py,database.py,mailer.py,models.py,nutrition.py,scraper.py
ignore_missing_imports = True
follow_imports = skip
check_untyped_defs = True
disallow_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
pretty = True
show_error_codes = True
exclude = (?x)(^\.venv/|^output/|^data/)
